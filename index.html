<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novig Markets</title>
  <meta name="description" content="Live Novig order books: moneylines, spreads, totals and market gaps.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23146c5a'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-tab="markets">
  <div class="wrap">
    <header class="head">
      <div class="head-row">
        <h1>Novig Markets <span class="ver" id="ver" title="Dashboard version"></span></h1>
        <button class="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
      </div>
    </header>

    <main>
    <section class="page" id="markets">
      <div class="card mk-card">
        <div class="mk-top">
          <div>
            <h2>Live markets</h2>
            <p class="note">Straight from Novig's public order books, no key needed. Prices are what it costs to buy that side right now, before any fee.</p>
          </div>
        </div>
        <div class="tools mk-tools">
          <select id="mk-league" aria-label="League"><option>NFL</option></select>
          <div class="seg" role="group" aria-label="View">
            <button class="mk-view" type="button" data-view="games" aria-pressed="true">Games</button>
            <button class="mk-view" type="button" data-view="futures" aria-pressed="false">Futures</button>
            <button class="mk-view" type="button" data-view="gaps" aria-pressed="false">Gaps</button>
          </div>
          <input type="search" id="mk-q" placeholder="Search teams or events" aria-label="Search events">
          <button class="btn" type="button" id="mk-refresh">Refresh</button>
          <label class="gapctl" title="Highlight markets whose gap (1 − both best bids) is wider than this">Gap over <input type="number" id="mk-gap" min="0" max="50" step="0.5" value="0.5" aria-label="Gap threshold in cents">¢</label>
          <label class="auto" id="mk-auto-label"><input type="checkbox" id="mk-auto" checked> Update every second</label>
        </div>
        <div class="mk-meta"><span><span id="mk-mode" class="mode" hidden></span><span id="mk-count"></span></span><span id="mk-status" aria-live="polite"></span></div>
        <div id="mk-gapbar" class="gapbar" hidden>
          <label>Scan <select id="mk-scope" aria-label="Markets to scan"><option value="main">Moneylines, spreads and totals</option><option value="all">Every market (slower)</option></select></label>
          <label class="auto"><input type="checkbox" id="mk-onesided"> Include one-sided books</label>
          <span id="mk-scan" class="muted"></span>
        </div>
        <div id="mk-verwarn" class="keynote" role="status" hidden></div>
        <div id="mk-keynote" class="keynote" role="status" hidden></div>
        <div id="mk-list" class="mk-list"></div>
      </div>
    </section>
    </main>

    <footer class="foot">
      <p>Unofficial. Data from Novig's order books. <a href="https://github.com/osonmurch-arch/novig-explorer/blob/main/CHANGELOG.md" rel="noopener">Changelog</a> · <span id="ver-foot"></span></p>
    </footer>
  </div>

  <script src="app.js"></script>
  <script src="markets.js"></script>
</body>
</html>
